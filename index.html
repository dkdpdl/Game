<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b2a3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>늑대섬 탐험기</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="bar top">
      <div class="lv">Lv <b id="lv">1</b></div>
      <div class="meter exp"><div id="expFill"></div><span>EXP</span></div>
      <div class="meter st"><div id="stFill"></div><span id="stText">30/30</span></div>
    </div>
    <div class="bar res" id="res"></div>
    <div id="quest"></div>
  </div>

  <div id="buttons" class="hidden">
    <button id="btnSniff" class="hbtn hidden"></button>
    <button id="btnPet" class="hbtn hidden"></button>
    <button id="btnBag" class="hbtn"></button>
    <button id="btnCraft" class="hbtn"></button>
    <button id="btnMenu" class="hbtn"></button>
  </div>

  <div id="toast"></div>

  <div id="modal" class="hidden">
    <div class="panel">
      <div class="ptitle" id="mTitle"></div>
      <div class="pbody" id="mBody"></div>
      <div class="pbtns" id="mBtns"></div>
    </div>
  </div>

  <div id="title">
    <div class="tbox">
      <img id="titleWolf" alt="">
      <h1>늑대섬 탐험기</h1>
      <p>표류한 섬에서 살아남아<br>늑대와 함께 고대 유적의 비밀을 풀어라!</p>
      <button id="btnNew" class="btn big">새로 시작</button>
      <button id="btnCont" class="btn big hidden">이어하기</button>
      <small>터치로 이동하고, 사물을 터치해 조사하세요.</small>
    </div>
  </div>

  <script src="js/sprites.js"></script>
  <script src="js/data.js"></script>
  <script src="js/world.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
